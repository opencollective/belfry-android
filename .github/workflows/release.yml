name: Release

# Push a tag v<major>.<minor>.<patch> (for example v0.1.0): a signed release APK is built and
# attached to a GitHub release of that tag. The signing key comes from the repository secrets:
#   ANDROID_KEYSTORE_BASE64   base64 of the PKCS12 keystore (release.jks)
#   ANDROID_KEYSTORE_PASSWORD its password
#   ANDROID_KEY_ALIAS         the key's alias (belfry)
#   ANDROID_KEY_PASSWORD      the key's password (the same as the store's for PKCS12)
# The version code grows with every tag: major*10000 + minor*100 + patch.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Version from the tag
        id: v
        run: |
          tag="${GITHUB_REF_NAME}"
          [[ "$tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]] || { echo "::error::tag $tag is not v<major>.<minor>.<patch>"; exit 1; }
          echo "name=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "code=$(( BASH_REMATCH[1] * 10000 + BASH_REMATCH[2] * 100 + BASH_REMATCH[3] ))" >> "$GITHUB_OUTPUT"
      - name: The signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ] || [ -z "$PASS" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD must be set in the repository secrets"; exit 1
          fi
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Core tests
        run: ./gradlew :core:test --stacktrace
      - name: Build the signed APK
        env:
          BELFRY_VERSION_NAME: ${{ steps.v.outputs.name }}
          BELFRY_VERSION_CODE: ${{ steps.v.outputs.code }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace
      - name: Check the signature
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          test -f "$apk" || { echo "::error::no signed APK (was it built unsigned?)"; ls app/build/outputs/apk/release; exit 1; }
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$bt/apksigner" verify --verbose --print-certs "$apk" > signer.txt 2>&1 || { cat signer.txt; echo "::error::the APK's signature does not verify"; exit 1; }
          grep -iE "verified using|certificate (DN|SHA-256)" signer.txt || cat signer.txt
          cp "$apk" "belfry-${{ steps.v.outputs.name }}.apk"
          sha256sum "belfry-${{ steps.v.outputs.name }}.apk" > "belfry-${{ steps.v.outputs.name }}.apk.sha256"
      - name: Remove the key from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "belfry-${{ steps.v.outputs.name }}.apk" "belfry-${{ steps.v.outputs.name }}.apk.sha256" \
            --title "Belfry for Android ${{ steps.v.outputs.name }}" --prerelease \
            --notes "Signed APK of Belfry for Android ${{ steps.v.outputs.name }}. Install it on a phone (allow installs from this source); it signs in to any belfry. Not on Google Play yet. The SHA-256 of the signing certificate is in the workflow log (for assetlinks.json)."
