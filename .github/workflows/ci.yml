name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: core (vectors)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Core tests (shared vectors)
        run: ./gradlew :core:test --stacktrace
      - name: Upload the timings (PerfTest; relative numbers, a CI runner is not a phone)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf
          path: core/build/perf.txt
          if-no-files-found: ignore
      - name: Upload the test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: core-reports
          path: core/build/reports
          if-no-files-found: ignore

  app:
    name: app (build, lint, screenshots)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Firebase config (push), when the GOOGLE_SERVICES_JSON secret is set
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "push on: app/google-services.json written"
          else
            echo "no GOOGLE_SERVICES_JSON secret: building with push off"
          fi
      - name: Build the app
        run: ./gradlew :app:assembleDebug --stacktrace
      - name: Lint
        run: ./gradlew :app:lintDebug --stacktrace
      - name: Screenshots (Robolectric + Roborazzi, demo mode)
        run: ./gradlew :app:recordRoborazziDebug --stacktrace
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: app/build/outputs/roborazzi/*.png
          if-no-files-found: warn
      - name: Upload the debug APK
        uses: actions/upload-artifact@v4
        with:
          name: belfry-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: app-reports
          path: app/build/reports
          if-no-files-found: ignore
