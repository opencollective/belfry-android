name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Core tests (shared vectors)
        run: ./gradlew :core:test --stacktrace
      - name: Build the app
        run: ./gradlew :app:assembleDebug --stacktrace
      - name: Lint
        run: ./gradlew :app:lintDebug --stacktrace
      - name: Screenshots (Robolectric + Roborazzi, demo mode)
        run: ./gradlew :app:recordRoborazziDebug --stacktrace
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: app/build/outputs/roborazzi/*.png
          if-no-files-found: warn
      - name: Upload the debug APK
        uses: actions/upload-artifact@v4
        with:
          name: belfry-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            core/build/reports
            app/build/reports
          if-no-files-found: ignore
