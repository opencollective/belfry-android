name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      shots:
        description: "Screenshots of these tests only (a Gradle --tests filter, e.g. *InviteSheet* or *PrintedCards*); empty = none"
        required: false
        default: ""

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: core (vectors)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Core tests (shared vectors)
        run: ./gradlew :core:test --stacktrace
      - name: Upload the timings (PerfTest; relative numbers, a CI runner is not a phone)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf
          path: core/build/perf.txt
          if-no-files-found: ignore
      - name: Upload the test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: core-reports
          path: core/build/reports
          if-no-files-found: ignore

  app:
    name: app (build, lint, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      # Robolectric fetches its Android runtime from Maven Central when the tests start; Central
      # answers 429 to GitHub's runners now and then, failing every test. Keep it between runs,
      # and when it is missing fetch it here, patiently.
      - name: Robolectric's Android runtime (kept between runs)
        id: robo
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-android-all-14-10818077-i7+15-12650502-i7
      - name: Fetch it when it is not there (Central, then its mirrors)
        id: robofetch
        run: |
          # both runtimes the tests use (SDK 34 and 35); a new Robolectric or SDK = a new line here and in the key
          ok=yes
          for v in 14-robolectric-10818077-i7 15-robolectric-12650502-i7; do
            dir="$HOME/.m2/repository/org/robolectric/android-all-instrumented/$v"
            mkdir -p "$dir"
            for ext in pom pom.sha512 jar jar.sha512; do
              f="$dir/android-all-instrumented-$v.$ext"
              [ -s "$f" ] && continue
              for base in https://repo1.maven.org/maven2 https://maven-central.storage-download.googleapis.com/maven2 https://repo.maven.apache.org/maven2; do
                if curl -fsSL --retry 2 --retry-delay 5 --retry-all-errors -o "$f.part" "$base/org/robolectric/android-all-instrumented/$v/android-all-instrumented-$v.$ext"; then
                  mv "$f.part" "$f"; echo "$v $ext from $base"; break
                fi
              done
              [ -s "$f" ] || { ok=no; echo "could not fetch $v $ext now: the tests will try themselves"; }
            done
            # the jar is what it says it is
            if [ -s "$dir/android-all-instrumented-$v.jar" ] && [ -s "$dir/android-all-instrumented-$v.jar.sha512" ]; then
              want=$(cut -d' ' -f1 "$dir/android-all-instrumented-$v.jar.sha512")
              got=$(sha512sum "$dir/android-all-instrumented-$v.jar" | cut -d' ' -f1)
              [ "$want" = "$got" ] || { echo "sha512 differs for $v: dropping the jar"; rm -f "$dir"/android-all-instrumented-$v.jar*; ok=no; }
            fi
            ls -la "$dir"
          done
          echo "complete=$ok" >> "$GITHUB_OUTPUT"
      # saved at once (not at the job's end), so a run whose tests fail still leaves it for the next
      - name: Keep it
        if: steps.robo.outputs.cache-hit != 'true' && steps.robofetch.outputs.complete == 'yes'
        uses: actions/cache/save@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-android-all-14-10818077-i7+15-12650502-i7
      - name: Firebase config (push), when the GOOGLE_SERVICES_JSON secret is set
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "push on: app/google-services.json written"
          else
            echo "no GOOGLE_SERVICES_JSON secret: building with push off"
          fi
      - name: Build the app
        run: ./gradlew :app:assembleDebug --stacktrace
      - name: Lint
        run: ./gradlew :app:lintDebug --stacktrace
      - name: Build the minified APK (R8 with the keep rules; a check, and something to try on a phone)
        run: ./gradlew :app:assembleMinified --stacktrace
      # Xavier, 2026-11-24: no full screenshot suite. The app's tests run without recording pictures
      # (the *ShotsTest classes, which only take pictures, are left out by app/build.gradle.kts).
      - name: App tests (Robolectric, demo mode; no screenshots)
        run: ./gradlew :app:testDebugUnitTest --stacktrace
      # Pictures only of the screens a change touches, when someone asks: a manual run with a filter.
      - name: Screenshots of the tests asked for
        if: github.event_name == 'workflow_dispatch' && inputs.shots != ''
        env:
          SHOTS: ${{ inputs.shots }}
        run: ./gradlew :app:recordRoborazziDebug -Pshots --tests "$SHOTS" --stacktrace
      - name: Upload the app's test report when a test failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: app-test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore
      - name: Upload screenshots
        if: github.event_name == 'workflow_dispatch' && inputs.shots != ''
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: app/build/outputs/roborazzi/*.png
          if-no-files-found: warn
      - name: Upload the debug APK
        uses: actions/upload-artifact@v4
        with:
          name: belfry-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - name: Upload the minified APK
        uses: actions/upload-artifact@v4
        with:
          name: belfry-minified-apk
          path: app/build/outputs/apk/minified/*.apk
          if-no-files-found: warn
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: app-reports
          path: app/build/reports
          if-no-files-found: ignore
